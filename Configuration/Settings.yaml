Devclaim:
  NeosStyleguide:
    # the node previews of the workspace review: "workspace:before|after:<node address>" (Compare.fusion)
    nodeReferences:
      workspace: Devclaim\NeosModernBackend\NodeReferences\WorkspaceNodeReferenceResolver

Neos:
  Fusion:
    defaultContext:
      # what kind of element a change of the workspace review is (Resources/Private/Fusion/Backend/Workspaces)
      'Devclaim.Change': Devclaim\NeosModernBackend\Eel\ChangeHelper
  Neos:
    # focus marked for the keyboard only (Resources/Public/Backend/Focus.css): all backend modules
    moduleConfiguration:
      additionalResources:
        styleSheets:
          'Devclaim.NeosModernBackend:Focus': 'resource://Devclaim.NeosModernBackend/Public/Backend/Focus.css'
    modules:
      management:
        submodules:
          # three panes like the activity log, the review with each change as the website shows it
          # (Resources/Private/Fusion/Backend, Views.yaml)
          workspace:
            additionalResources:
              javaScripts:
                'Devclaim.NeosModernBackend:Compare': 'resource://Devclaim.NeosModernBackend/Public/Backend/Compare.js'
                'Devclaim.NeosModernBackend:Workspaces': 'resource://Devclaim.NeosModernBackend/Public/Backend/Workspaces.js'
              styleSheets:
                'Devclaim.NeosModernBackend:Compare': 'resource://Devclaim.NeosModernBackend/Public/Backend/Compare.css'
                'Devclaim.NeosModernBackend:Workspaces': 'resource://Devclaim.NeosModernBackend/Public/Backend/Workspaces.css'
    userInterface:
      inspector:
        dataTypes:
          # every integer property gets the number input of Devclaim.NeosUiEditors (minus, plus, the range of
          # editorOptions min and max); Neos.Neos/Inspector/Editors/TextFieldEditor: the text field of the Neos UI
          integer:
            editor: 'Devclaim.NeosUiEditors/Inspector/Editors/NumberEditor'
      translation:
        autoInclude:
          'Devclaim.NeosModernBackend':
            - Main
    Ui:
      resources:
        javascript:
          'Devclaim.NeosModernBackend:Plugin':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Neos.Ui/Plugin.js'
            # right after the Neos UI: it replaces the DateInput of the Neos UI for the plugins loaded after it
            position: 'after Neos.Neos.UI:Host'
        stylesheets:
          # focus marked for the keyboard only, as in the backend modules
          'Devclaim.NeosModernBackend:Focus':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Focus.css'
      frontendConfiguration:
        'Devclaim.NeosModernBackend':
          # distance between the node and its outline (px); less where the frame has no room for it
          offset: 10
          # distance kept to the edge of the frame (px), where the offset does not fit
          gap: 8
          # the outline moves from node to node (off with prefers-reduced-motion)
          animate: true
          # duration of the movement (ms)
          duration: 180
          # drag and drop of the selected node in the page (it zooms out while dragging), instead of the native one
          dragAndDrop: true
          # the document and content tree in the left sidebar in the style of the inspector
          sidebar: true
          # the DateTimeEditor with a calendar that can be typed into (react-day-picker), instead of the one of the Neos UI;
          # also the DateInput other plugins render in their editors (e.g. the occurrences of NeosSvelte.Events)
          dateTimeEditor: true
