Devclaim:
  NeosModernBackend:
    # the roles in the user module (Classes/UserRoles/RoleDescriptions.php), per role identifier, all optional:
    #   label, description: in place of the ones of the policy
    #   can: what the role allows, as texts (what sets it apart: what it does not allow is what it does not list)
    #   derive: false leaves out what the policy grants (true: its modules and the labels of its other privileges)
    #   position: the order (smaller first; the rest by name)
    userRoles: {}
  NeosStyleguide:
    # the node previews of the workspace review: "workspace:before|after:<node address>" (Compare.fusion)
    nodeReferences:
      workspace: Devclaim\NeosModernBackend\NodeReferences\WorkspaceNodeReferenceResolver

Neos:
  Fusion:
    defaultContext:
      # what kind of element a change of the workspace review is (Resources/Private/Fusion/Backend/Workspaces)
      'Devclaim.Change': Devclaim\NeosModernBackend\Eel\ChangeHelper
  Neos:
    # focus marked for the keyboard only (Resources/Public/Backend/Focus.css): all backend modules
    moduleConfiguration:
      # the overview of a group of modules: a card per module (Resources/Private/Templates/Module/Widget.html)
      widgetTemplatePathAndFileName: 'resource://Devclaim.NeosModernBackend/Private/Templates/Module/Widget.html'
      additionalResources:
        styleSheets:
          'Devclaim.NeosModernBackend:Focus': 'resource://Devclaim.NeosModernBackend/Public/Backend/Focus.css'
          # the menu button, the chevrons, one menu (Resources/Public/Backend/Chrome.css)
          'Devclaim.NeosModernBackend:Chrome': 'resource://Devclaim.NeosModernBackend/Public/Backend/Chrome.css'
          # the splash between the modules when a change takes long (Resources/Public/Backend/Transition.css)
          'Devclaim.NeosModernBackend:Transition': 'resource://Devclaim.NeosModernBackend/Public/Backend/Transition.css'
        javaScripts:
          # search fields do not take the focus when a page opens (Resources/Public/Backend/Focus.js)
          'Devclaim.NeosModernBackend:Focus': 'resource://Devclaim.NeosModernBackend/Public/Backend/Focus.js'
          # the menu closes with Escape and a click beside it (Resources/Public/Backend/Menu.js)
          'Devclaim.NeosModernBackend:Menu': 'resource://Devclaim.NeosModernBackend/Public/Backend/Menu.js'
          # the splash between the modules when a change takes long (Resources/Public/Backend/Transition.js)
          'Devclaim.NeosModernBackend:Transition': 'resource://Devclaim.NeosModernBackend/Public/Backend/Transition.js'
    modules:
      administration:
        # the overviews of the groups are made for phones as well (Templates/Module/Widget.html, Chrome.css)
        viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
        submodules:
          # made for phones as well (Resources/Public/Backend/Packages.css)
          packages:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              styleSheets:
                'Devclaim.NeosModernBackend:Packages': 'resource://Devclaim.NeosModernBackend/Public/Backend/Packages.css'
          # made for phones as well (Resources/Public/Backend/Dimensions.css)
          dimensions:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              styleSheets:
                'Devclaim.NeosModernBackend:Dimensions': 'resource://Devclaim.NeosModernBackend/Public/Backend/Dimensions.css'
          # made for phones as well (Resources/Public/Backend/Configuration.css)
          configuration:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              styleSheets:
                'Devclaim.NeosModernBackend:Configuration': 'resource://Devclaim.NeosModernBackend/Public/Backend/Configuration.css'
          # made for phones as well (Resources/Public/Backend/Sites.css)
          sites:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              styleSheets:
                'Devclaim.NeosModernBackend:Sites': 'resource://Devclaim.NeosModernBackend/Public/Backend/Sites.css'
          # the roles of an account: what each is for, contains and allows (Partials/UserModule, Views.yaml); made for
          # phones as well
          users:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              javaScripts:
                'Devclaim.NeosModernBackend:Users': 'resource://Devclaim.NeosModernBackend/Public/Backend/Users.js'
              styleSheets:
                'Devclaim.NeosModernBackend:Users': 'resource://Devclaim.NeosModernBackend/Public/Backend/Users.css'
      management:
        viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
        submodules:
          # made for phones as well, its sidebar (Resources/Public/Backend/Media.css and .js)
          media:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              javaScripts:
                'Devclaim.NeosModernBackend:Media': 'resource://Devclaim.NeosModernBackend/Public/Backend/Media.js'
              styleSheets:
                'Devclaim.NeosModernBackend:Media': 'resource://Devclaim.NeosModernBackend/Public/Backend/Media.css'
          # made for phones as well (Resources/Public/Backend/Redirects.css)
          redirects:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              styleSheets:
                'Devclaim.NeosModernBackend:Redirects': 'resource://Devclaim.NeosModernBackend/Public/Backend/Redirects.css'
          # three panes like the activity log, the review with each change as the website shows it
          # (Resources/Private/Fusion/Backend, Views.yaml)
          workspace:
            # made for phones as well: the viewport of the module page (Templates/Backend/Module/Index.html)
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
            additionalResources:
              javaScripts:
                'Devclaim.NeosStyleguide:Preview': 'resource://Devclaim.NeosStyleguide/Public/Preview/Preview.js'
                'Devclaim.NeosModernBackend:Compare': 'resource://Devclaim.NeosModernBackend/Public/Backend/Compare.js'
                'Devclaim.NeosModernBackend:Workspaces': 'resource://Devclaim.NeosModernBackend/Public/Backend/Workspaces.js'
              styleSheets:
                'Devclaim.NeosStyleguide:Preview': 'resource://Devclaim.NeosStyleguide/Public/Preview/Preview.css'
                'Devclaim.NeosModernBackend:Compare': 'resource://Devclaim.NeosModernBackend/Public/Backend/Compare.css'
                'Devclaim.NeosModernBackend:Workspaces': 'resource://Devclaim.NeosModernBackend/Public/Backend/Workspaces.css'
      user:
        viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
        submodules:
          usersettings:
            viewport: 'width=device-width, initial-scale=1, viewport-fit=cover'
    userInterface:
      backendLoginForm:
        stylesheets:
          # the login on phones (Resources/Public/Backend/Login.css)
          'Devclaim.NeosModernBackend:Login': 'resource://Devclaim.NeosModernBackend/Public/Backend/Login.css'
      inspector:
        dataTypes:
          # every integer property gets the number input of Devclaim.NeosUiEditors (minus, plus, the range of
          # editorOptions min and max); Neos.Neos/Inspector/Editors/TextFieldEditor: the text field of the Neos UI
          integer:
            editor: 'Devclaim.NeosUiEditors/Inspector/Editors/NumberEditor'
      translation:
        autoInclude:
          'Devclaim.NeosModernBackend':
            - Main
    Ui:
      resources:
        javascript:
          'Devclaim.NeosModernBackend:Plugin':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Neos.Ui/Plugin.js'
            # right after the Neos UI: it replaces the DateInput of the Neos UI for the plugins loaded after it
            position: 'after Neos.Neos.UI:Host'
          # a section of the menu opens and closes with its chevron only, not with its link (Public/Backend/Drawer.js)
          'Devclaim.NeosModernBackend:Drawer':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Drawer.js'
          # the splash over the content module when going to a backend module takes long (Public/Backend/Transition.js)
          'Devclaim.NeosModernBackend:Transition':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Transition.js'
        stylesheets:
          # focus marked for the keyboard only, as in the backend modules
          'Devclaim.NeosModernBackend:Focus':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Focus.css'
          # the menu button and the chevrons, as in the backend modules
          'Devclaim.NeosModernBackend:Chrome':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Chrome.css'
          # the splash when going to a backend module, the content module dark before its own splash
          'Devclaim.NeosModernBackend:Transition':
            resource: 'resource://Devclaim.NeosModernBackend/Public/Backend/Transition.css'
      frontendConfiguration:
        'Devclaim.NeosModernBackend':
          # distance between the node and its outline (px); less where the frame has no room for it
          offset: 10
          # distance kept to the edge of the frame (px), where the offset does not fit
          gap: 8
          # the outline moves from node to node (off with prefers-reduced-motion)
          animate: true
          # duration of the movement (ms)
          duration: 180
          # drag and drop of the selected node in the page (it zooms out while dragging), instead of the native one
          dragAndDrop: true
          # the document and content tree in the left sidebar in the style of the inspector
          sidebar: true
          # on phones and tablets (below 1024px) the page at full width and the sidebars as drawers, see README.md
          phoneDrawers: true
          # the DateTimeEditor with a calendar that can be typed into (react-day-picker), instead of the one of the Neos UI;
          # also the DateInput other plugins render in their editors (e.g. the occurrences of NeosSvelte.Events)
          dateTimeEditor: true
